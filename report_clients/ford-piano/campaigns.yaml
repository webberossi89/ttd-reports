# Source of truth for which campaigns get their own block in the 2026 Report
# tab, and in what order. Blocks are laid out in this order, top to bottom.
#
# DO NOT hand-edit the layout anywhere else. build_campaign_tab.py reads this
# file and derives BOTH the sheet layout AND the `sections:` block in
# config.yaml from it, so the two can never drift apart.
#
# To add a campaign (Shapeshift clients live outside the Duo clients root, so
# --clients-root is required):
#
#   cd ~/mcp/servers/google-ads
#   uv run python3 ~/duo-reports/lead_tracker/build_campaign_tab.py \
#     --clients-root ~/shapeshift-reports/report_clients \
#     --client ford-piano add <campaign_id> --title "SEARCH | ..." --apply
#
# `title` is the sheet block header AND the engine's section anchor. Changing
# one changes both, which is the point.

report_title: "Ford Piano | Paid Media Report"

# Account campaign names here are "Ford Piano - <theme> - shapeshift - <date>",
# with no pipes, so derive_title() cannot split them into a useful header.
# Titles are passed explicitly with --title instead.
strip_name_prefixes: ["FORD PIANO"]

campaigns:
  - id: "23883535091"
    title: "SEARCH | PIANO REPAIR & REBUILDING"
