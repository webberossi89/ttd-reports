# --------------------------------------------------------------------------
# WHERE THE LEAD NUMBERS COME FROM, and why not from Google Ads conversions.
# --------------------------------------------------------------------------
# Same situation as Ford Piano: this account cannot produce a Form/Phone split
# on its own. "WC All Leads (167229)" (UPLOAD_CLICKS) is a single MIXED bucket
# of forms and calls; "WC Call Extension" (UPLOAD_CALLS) has recorded zero; the
# GA4 twins "(web) web_form_unique" / "phone_call_unique" are HIDDEN with zero;
# and "Local actions - Website visits" is flagged primary-for-goal despite
# being a Maps click, not a lead.
#
# So lead COUNTS come from WhatConverts lead_type, and spend / clicks /
# impressions come from Google Ads.
conversion_action_buckets:
  # Deliberately empty. Google Ads conversion actions are NOT the lead source
  # here (see above); WhatConverts overwrites form_leads / phone_leads after
  # the Ads pull.
  form: []
  phone: []

wc_lead_source:
  creds: ~/shapeshift-reports/.secrets/whatconverts.env
  profile_id: 167229            # "H & H Signature Renovations" under Shapeshift account 87660
  lead_source: google

  # CAMPAIGN-KEYED, and it is the campaign match that excludes our test leads.
  # Read before changing.
  #
  # Our own tracking and email-deliverability tests land in WhatConverts as
  # ordinary unique leads with lead_source google + lead_medium cpc, and are
  # otherwise indistinguishable from prospects. Five of the eight paid leads on
  # record for 2026 were ours. Matching on the real campaign's utm_campaign
  # drops the ones that carried an invented campaign string:
  #   2026-06-05 "bathroom-remodel-test", 2026-07-28 "test",
  #   2026-07-31 "attribution-test" (x2)
  # See feedback_wc_test_leads_inflate_ppc_counts.
  #
  # STILL LEAKS ONE: the 2026-06-22 web form is also ours
  # (trackingtest@thomastowndigital.com, gclid TESTGCLID_verify_2026) but was
  # fired against the REAL utm_campaign, so no campaign filter can see it. It
  # inflates June form_leads by 1. The durable fix is to flag it spam in
  # WhatConverts, which this engine already honours; until then June is +1.
  campaign_sections:
    "SEARCH | KITCHEN & BATH REMODELING": ["search-kb-ss-5.1.26"]

  # Our test leads carry invented utm_campaigns and so match no block. That is
  # correct here and must not fail the run, but the engine still prints each
  # one, which is the audit trail.
  allow_unmapped: true

  # NOTE for whoever adds require_gclid later: it is the wrong tool on this
  # account, unlike Ford Piano. Every test lead carries a FAKE gclid
  # (TESTGCLID123, TTDTEST_20260731, TESTGCLID_verify_2026, TESTgclid_abc123),
  # so they all pass a gclid check, while the genuine 2026-05-21 phone call
  # carries none and would be dropped. It would remove a real lead and keep
  # four fake ones.

# Sections are keyed on CAMPAIGN, not channel, the same shape as Ford Piano and
# the Duo clients. IDs, not names, so a campaign rename can never silently zero
# a row.
#
# EVERYTHING BETWEEN THE MARKERS BELOW IS GENERATED from campaigns.yaml by
# build_campaign_tab.py, which also lays out the sheet, so the two can never
# drift apart. Do not hand-edit it.
# >>> BEGIN GENERATED SECTIONS (build_campaign_tab.py) - do not hand-edit
# Derived from campaigns.yaml. Anchors match col A of the tab exactly.
sections:
  - anchor: "SEARCH | KITCHEN & BATH REMODELING"
    campaign_ids: ["23811011948"]
    inputs:
      1: clicks
      2: impressions
      4: cost
      6: form_leads
      7: phone_leads

  # QA block. `__all_campaigns__` is total cost across EVERY campaign in
  # the account on any channel, mapped here or not. The sheet subtracts
  # the sum of the campaign blocks from it; that row must read $0.00.
  - anchor: "QA | UNMAPPED SPEND CHECK"
    data_from: "__all_campaigns__"
    inputs:
      1: cost
# <<< END GENERATED SECTIONS

# July 2026 hand-reconciled 2026-08-05 against both sources. Google Ads:
# 15 clicks / 267 impr / $191.63. WhatConverts: 2 leads carried lead_medium cpc
# but BOTH were our own tests ("test" 7-28, "attribution-test" 7-31), so the
# genuine paid lead count for July is ZERO. Google Ads independently recorded
# 0 conversions for the month, which agrees.
validation:
  "2026-07":
    "SEARCH | KITCHEN & BATH REMODELING":
      clicks: 15
      impressions: 267
      cost: 191.63
      form_leads: 0
      phone_leads: 0

currency_offsets: [4]
lsa_currency_offsets: [2]

# No hand-entered cells anywhere in the tab, so the monthly close-out may
# force-overwrite.
fully_automated: true
