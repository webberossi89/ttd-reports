# Source of truth for which campaigns get their own block in the 2026 Report
# tab, and in what order. Blocks are laid out in this order, top to bottom.
#
# DO NOT hand-edit the layout anywhere else. build_campaign_tab.py reads this
# file and derives BOTH the sheet layout AND the `sections:` block in
# config.yaml from it, so the two can never drift apart.
#
#   cd ~/mcp/servers/google-ads
#   uv run python3 ~/duo-reports/lead_tracker/build_campaign_tab.py \
#     --clients-root ~/shapeshift-reports/report_clients \
#     --client demolition-experts-ny add <campaign_id> --title "SEARCH | ..." --apply

report_title: "Demolition Experts NY | Paid Media Report"

# Ordered by 2026 spend. Account campaign names ("Search - Demolition AI Max")
# have no pipes for derive_title() to split on, so titles are passed explicitly.
#
# 2026 spend through 2026-08-06:
#   23342935085 Search - Demolition        $10,570.82   Jan-Aug
#   23254223274 Search - Demolition AI Max  $7,233.14   Jan-Aug
#   23365315830 Performance Max             $1,187.45   Jan-Aug (PAUSED 2026-08-06)
#   23484509507 LSA (system-generated)        $187.80   Feb only
#
# The LSA campaign is listed because it DID spend, in February only. Leaving it
# out would surface $187.80 in the QA unmapped-spend row for that month. Every
# other paused legacy campaign in this account spent $0.00 in 2026 and is
# correctly absent; the QA row catches any that start spending.
campaigns:
  - id: "23342935085"
    title: "SEARCH | DEMOLITION"
  - id: "23254223274"
    title: "SEARCH | DEMOLITION AI MAX"
  - id: "23365315830"
    title: "PMAX | PERFORMANCE MAX"
  - id: "23484509507"
    title: "LSA | LOCAL SERVICES"
