# South Coast Demo: YouForm -> WhatConverts push.
# Replaces the Zapier "YouForm -> WhatConverts" Zap (sunset 2026-07).
#
# The retired Zap forwarded only email + phone, so every web-form lead landed
# in WhatConverts with a blank Contact Name and blank Message. This config
# forwards the full submission instead.
display_name: "South Coast Demo"

# Source
youform_creds: ~/southcoastdemo/.secrets/youform.env

# Destination
wc_creds: ~/shapeshift-reports/.secrets/whatconverts.env
wc_profile_id: 134236

# Both live South Coast forms. Field roles (name/email/phone/message) are
# detected from each form's block definitions, not hardcoded UUIDs, so the
# sync survives Cory editing or re-duplicating a form.
forms:
  - slug: s8wekhgv     # "South Coast Demo Lead Form"  (site-wide contact form)
  - slug: 917pki9t     # "South Coast Scanning & Cutting Lead Form" (GPR + saw-cutting LPs)

# Never push anything submitted before this instant. Guards against
# backfilling years of historical submissions into the client's WhatConverts.
cutover_at: "2026-07-01T00:00:00Z"

# How far back to re-examine each run. Cheap, and lets a lead that failed to
# push on one run get retried on the next.
lookback_days: 7

# Widened to cover the observed Zapier lag: the Zap stamped WhatConverts leads
# up to ~4 min after the true YouForm submission time (e.g. sub 15135768 at
# 18:29:56 -> WC lead 249386239 at 18:33:00). Used only for duplicate matching.
duplicate_match_minutes: 30

# YouForm already emails cory@southcoastdemo.com, info@shapeshiftmarketing.com
# and jaredwebber1989@gmail.com on every submission, so a WhatConverts
# notification would be a second copy of the same lead. Flip to true if you
# would rather notifications come from WhatConverts than from YouForm.
send_notification: false

state_file: ~/shapeshift-reports/youform_wc_sync/state_south_coast_demo.json
