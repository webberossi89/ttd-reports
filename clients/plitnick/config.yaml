# Shapeshift Lead Tracker config — Plitnick Plumbing and Heating
# Channels: SEO-Organic, SEO-GBP, PPC, Direct, Referral
#
# To finish wiring this up, set:
#   1. wc_profile_id (from WhatConverts → Profile settings)
#   2. tab_name (whichever tab in the sheet is for Plitnick — likely "Plitnick"
#      or a year-named tab like "2026")
#   3. anchor_text matches the row where January..December headers live
#
# Then run:
#   cd ~/mcp/servers/google-ads
#   uv run python3 ~/shapeshift-reports/lead_tracker/pull_wc.py \
#     --config ~/shapeshift-reports/clients/plitnick/config.yaml \
#     --months 2026-04 --sample 3
#
# Inspect the raw lead fields, then tighten classification_rules below if
# the defaults misclassify GBP vs SERP organic.

display_name: "Plitnick Plumbing and Heating"

# WhatConverts credentials + profile
wc_creds: ~/shapeshift-reports/.secrets/whatconverts.env
wc_profile_id: 164949     # Plitnick HVAC (Shapeshift account 87660)
wc_date_field: date_created

# Google Sheet target
spreadsheet_id: "1PMxbjV8GeANtw_uPd8pvCjSjIpRYPLxygWirZGkfqiE"
tab_name: "Plitnick"
anchor_text: "Month"

# Row label (in col A) → channel key
rows:
  "Total Leads":   total
  "SEO - Organic": seo_organic
  "SEO - GBP":     seo_gbp
  "PPC":           ppc
  "Direct":        direct
  "Referral":      referral

# Unified Shapeshift Lead Tracker rules. Order applied:
# seo_gbp → ppc → seo_organic → direct → referral → unclassified.
# Plitnick note: no dedicated GBP tracking number exists yet, so seo_gbp
# stays 0 here until one is added in WC.
classification_rules:
  seo_gbp:
    - {phone_name: "gbp"}
    - {phone_name: "google business"}
    - {phone_name: "google my business"}
    - {phone_name: "gmb"}
    - {lead_source: "gmb"}
  ppc:
    - {lead_medium: ["cpc", "ppc", "paid"]}
    - {phone_name: ["google ads", "google call extension", "google call asset", "lsa", "meta", "facebook"]}
  seo_organic:
    - {lead_medium: "organic"}
    - {lead_source: ["google", "bing", "yahoo", "duckduckgo", "ecosia"]}
  direct:
    - {lead_source: ["(direct)", "website"]}
    - {lead_medium: "direct"}
  referral:
    - {lead_medium: ["referral", "email", "social"]}
    - {lead_source: "chatgpt"}
