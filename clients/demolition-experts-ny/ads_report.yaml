display_name: "Demolition Experts NY"

google_ads:
  customer_id: "6246278923"
  creds: /home/jared/mcp/secrets/google-ads/ttd.yaml   # login_customer_id 5199864700

wc_creds: ~/shapeshift-reports/.secrets/whatconverts.env
wc_profile_id: 155565
wc_date_field: date_created

spreadsheet_id: "16MhrAXxhME3vN8apO4oZDWIbM-s856j8cHziw5P96TE"
tab_name: "2026"
year: 2026

# PMax leads carry lead_campaign like "Pmax"; peel them out of the generic
# ppc (Search) bucket into ppc_pmax so the PMax section fills separately.
pmax_campaign_match: ["pmax", "performance max"]

sections:
  # Google Ads Search: clicks/impr/cost from SEARCH; form/phone from WC ppc
  # (paid leads that are NOT pmax and NOT lsa).
  search:
    google_ads_channel: SEARCH
    wc_channel: ppc
    rows:
      clicks: 4
      impressions: 5
      cost: 7
      form_leads: 9
      phone_leads: 10
      # Qualified Leads (row 50) is under Total Paid Search = Search + PMax,
      # so sum qualified across both WC paid buckets.
      qualified_leads: 50
    qualified_wc_channels: ["ppc", "ppc_pmax"]
  # Performance Max: clicks/impr/cost from PERFORMANCE_MAX; web/phone "conversions"
  # rows (21/22) from WC pmax leads (small volume).
  pmax:
    google_ads_channel: PERFORMANCE_MAX
    wc_channel: ppc_pmax
    rows:
      clicks: 16
      impressions: 17
      cost: 19
      form_leads: 21    # "Web Conversions"
      phone_leads: 22   # "Phone Conversions"
  # Local Services: leads from WC lsa; cost from Google Ads LOCAL_SERVICES.
  lsa:
    google_ads_channel: LOCAL_SERVICES
    wc_channel: lsa
    rows:
      leads: 53
      cost: 54
      qualified_leads: 56
    row_labels:
      56: "Qualified Leads"

classification_rules:
  seo_gbp:
    - {phone_name: "gbp"}
    - {phone_name: "google business"}
    - {phone_name: "google my business"}
    - {phone_name: "gmb"}
    - {lead_source: "gmb"}
  lsa:
    - {lead_campaign: "lsa"}
  ppc:
    - {lead_medium: ["cpc", "ppc", "paid"]}
    - {phone_name: ["google ads", "google call extension", "google call asset", "meta", "facebook"]}
  seo_organic:
    - {lead_medium: "organic"}
    - {lead_source: ["google", "bing", "yahoo", "duckduckgo", "ecosia"]}
  direct:
    - {lead_source: ["(direct)", "website"]}
    - {lead_medium: "direct"}
  referral:
    - {lead_medium: ["referral", "email", "social"]}
    - {lead_source: "chatgpt"}
