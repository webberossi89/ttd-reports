# Shared classification rules for all Shapeshift Lead Tracker clients.
# Each client config inlines this verbatim under `classification_rules:`.
# Order applied: seo_gbp → ppc → seo_organic → direct → referral → unclassified.
classification_rules:
  seo_gbp:
    - {phone_name: "gbp"}                # catches "GBP Listing", "GBP - Direct Call"
    - {phone_name: "google business"}
    - {phone_name: "google my business"}
    - {phone_name: "gmb"}
    - {lead_source: "gmb"}                # WC's GBP attribution token
  ppc:
    - {lead_medium: ["cpc", "ppc", "paid"]}
    - {phone_name: ["google ads", "google call extension", "google call asset", "lsa", "meta", "facebook"]}
  seo_organic:
    - {lead_medium: "organic"}
    - {lead_source: ["google", "bing", "yahoo", "duckduckgo", "ecosia"]}
  direct:
    - {lead_source: ["(direct)", "website"]}
    - {lead_medium: "direct"}
  referral:
    - {lead_medium: ["referral", "email", "social"]}
    - {lead_source: "chatgpt"}
