# Demolition Experts lead-sheet sync (replaces the Zapier WhatConverts -> Sheet Zap)
display_name: "Demolition Experts NY"

# WhatConverts source
wc_creds: ~/shapeshift-reports/.secrets/whatconverts.env
wc_profile_id: 155565

# Destination Google Sheet (the old Zapier target)
spreadsheet_id: "1o6NYcVJg7tM_oH3WnNDfcoc10E4d2gQK7tOh61Tmid4"
tab_name: "Leads"          # renamed from "April" on 2026-08-06; sync_leads.py resolves
                           # the tab by TITLE, so this must track any tab rename
sheets_creds: ~/recnation/lsa-refresh/.secrets/sheets.yaml

# Behaviour
lookback_days: 3
summary_wait_minutes: 25
include_repeat: true
include_spam: false

# Fixed column order of the destination sheet (A..S). NOTE: this sheet has an
# extra "Bad Lead" column (col I) that the Mr Cheapee sheet does not. Do not reorder.
columns:
  - "Lead ID"
  - "Contact Name"
  - "Email Address"
  - "Phone Number"
  - "Time"
  - "Lead Type"
  - "Message"
  - "Qualified Lead?"
  - "Bad Lead"
  - "Appointment Booked?"
  - "Deal Closed?"
  - "Notes"
  - "Source"
  - "Medium"
  - "Campaign"
  - "Content"
  - "Keyword"
  - "GCLID"
  - "Referring site"
