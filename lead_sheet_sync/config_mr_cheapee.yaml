# Mr Cheapee lead-sheet sync (replaces the Zapier WhatConverts -> Sheet Zap)
display_name: "Mr Cheapee Inc"

# WhatConverts source
wc_creds: ~/shapeshift-reports/.secrets/whatconverts.env
wc_profile_id: 157053

# Destination Google Sheet (the old Zapier target)
spreadsheet_id: "1Xu3ec74sKxqCBlPsb98rx88PYFADPBmCWKrwG5MJ33Y"
tab_name: "April"          # the single existing tab the Zap writes into
sheets_creds: ~/recnation/lsa-refresh/.secrets/sheets.yaml

# Behaviour
lookback_days: 3           # how far back each poll looks for new leads
summary_wait_minutes: 25   # for phone calls, wait this long for the AI Lead Summary
                           # before writing the row anyway (skip if newer + no summary)
include_repeat: true       # include WhatConverts "Repeat" leads (return callers)
include_spam: false        # skip leads WhatConverts flagged as spam

# Lead IDs to never write to the sheet (our own test submissions).
# Dedup keys on Lead IDs read from the sheet, so a deleted row inside the
# lookback window would otherwise be re-added on the next poll.
exclude_lead_ids:
  - 249030420              # TTD test submission 2026-07-27, phone-in-notification check
  - 249046079              # TTD test submission 2026-07-27, WC field-mapping check

# Fixed column order of the destination sheet (A..R). Do not reorder.
columns:
  - "Lead ID"
  - "Contact Name"
  - "Email Address"
  - "Phone Number"
  - "Time"
  - "Lead Type"
  - "Message"
  - "Qualified Lead?"
  - "Appointment Booked?"
  - "Deal Closed?"
  - "Notes"
  - "Source"
  - "Medium"
  - "Campaign"
  - "Content"
  - "Keyword"
  - "GCLID"
  - "Referring site"
