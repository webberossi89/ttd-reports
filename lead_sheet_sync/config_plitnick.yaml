# Plitnick lead-sheet sync (replaces the Zapier WhatConverts -> Sheet Zap)
display_name: "Plitnick Plumbing and Heating"

# WhatConverts source
wc_creds: ~/shapeshift-reports/.secrets/whatconverts.env
wc_profile_id: 164949

# Destination Google Sheet (the old Zapier target). Note: writes to Sheet1 (gid 0);
# Sheet2 is a separate scratch tab the Zap does not touch.
spreadsheet_id: "19xwER2sOuBFrZLbzhg5YTkyoHuihNhmnpbSlmzgTUg8"
tab_name: "Sheet1"
sheets_creds: ~/recnation/lsa-refresh/.secrets/sheets.yaml

# Behaviour
lookback_days: 3
summary_wait_minutes: 25
include_repeat: true
include_spam: false
# This sheet's "Notes" column carries the WhatConverts AI "Customer Type"
# (New Customer / Existing Customer / Other), unlike the other clients.
notes_source: customer_type

# Fixed column order of the destination sheet (A..R). Col A header is blank in the
# sheet but holds the Lead ID. Map by position; names here drive the value lookup.
columns:
  - "Lead ID"
  - "Contact Name"
  - "Email Address"
  - "Phone Number"
  - "Time"
  - "Lead Type"
  - "Message"
  - "Qualified Lead?"
  - "Appointment Booked?"
  - "Deal Closed?"
  - "Notes"
  - "Source"
  - "Medium"
  - "Campaign"
  - "Content"
  - "Keyword"
  - "GCLID"
  - "Referring site"
